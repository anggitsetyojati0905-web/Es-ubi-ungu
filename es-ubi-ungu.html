<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purple Taro Cheese - Pesan Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="bg-purple-50 text-gray-800">

  <!-- Header / Banner -->
  <header class="bg-gradient-to-r from-purple-900 via-purple-800 to-indigo-900 text-white py-10 px-6 text-center shadow-lg">
    <span class="bg-purple-700 text-purple-200 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">Super Fresh & Creamy</span>
    <h1 class="text-3xl md:text-5xl font-extrabold mt-3 mb-2">Purple Taro Cheese</h1>
    <p class="text-purple-200 max-w-xl mx-auto text-sm md:text-base">
      Sensasi manis alami ubi ungu asli, krim susu lembut, dan limpahan keju parut gurih!
    </p>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 space-y-8">

    <!-- Card Produk & Form Pemesanan -->
    <div class="bg-white rounded-3xl shadow-xl overflow-hidden md:flex border border-purple-100">
      
      <!-- Gambar & Visual -->
      <div class="md:w-1/2 p-6 bg-purple-100/60 flex flex-col items-center justify-center">
        <!-- Ganti URL src gambar sesuai dengan gambar minumu -->
        <img src="image2.img" alt="Purple Taro Cheese" class="rounded-2xl shadow-md max-h-80 object-cover border-4 border-white">
        
        <div class="mt-4 text-center">
          <span class="text-xs font-medium text-purple-700 bg-purple-200 px-3 py-1 rounded-full">Toping Potongan Ubi Asli Included</span>
        </div>
      </div>

      <!-- Interactive Form -->
      <div class="md:w-1/2 p-6 md:p-8">
        <h2 class="text-2xl font-bold text-purple-900 mb-4">Form Pemesanan</h2>
        
        <form id="orderForm" class="space-y-4" onsubmit="event.preventDefault(); sendToWhatsApp();">
          <!-- Nama Pembeli -->
          <div>
            <label for="buyerName" class="block text-xs font-semibold text-gray-600 mb-1">Nama Pemesan</label>
            <input type="text" id="buyerName" placeholder="Contoh: Budi" required class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none text-sm">
          </div>

          <!-- Pilihan Ukuran -->
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Pilih Ukuran Cup</label>
            <div class="grid grid-cols-2 gap-2" role="tablist" aria-label="Pilih ukuran">
              <button type="button" id="sizeMedium" aria-pressed="true" onclick="selectSize('Medium', 15000, this)" class="size-btn border-2 border-purple-600 bg-purple-50 text-purple-900 py-2 rounded[...]
                Medium (15k)
              </button>
              <button type="button" id="sizeLarge" aria-pressed="false" onclick="selectSize('Large', 18000, this)" class="size-btn border-2 border-gray-200 text-gray-600 py-2 rounded-xl text-xs font-b[...]
                Large (18k)
              </button>
            </div>
          </div>

          <!-- Extra Topping -->
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Ekstra Topping (+Rp 3.000)</label>
            <div class="flex gap-4 text-xs font-medium text-gray-700">
              <label class="flex items-center gap-1 cursor-pointer">
                <input type="checkbox" id="topKeju" onchange="calculateTotal()" class="accent-purple-600"> Extra Keju
              </label>
              <label class="flex items-center gap-1 cursor-pointer">
                <input type="checkbox" id="topBoba" onchange="calculateTotal()" class="accent-purple-600"> Extra Boba
              </label>
            </div>
          </div>

          <!-- Jumlah -->
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Jumlah (Cup)</label>
            <div class="flex items-center gap-3">
              <button type="button" aria-label="Kurangi jumlah" onclick="changeQty(-1)" class="w-8 h-8 rounded-lg bg-gray-200 font-bold text-gray-700">-</button>
              <span id="qtyText" class="font-bold text-base">1</span>
              <button type="button" aria-label="Tambah jumlah" onclick="changeQty(1)" class="w-8 h-8 rounded-lg bg-purple-200 font-bold text-purple-800">+</button>
            </div>
          </div>

          <!-- Total & Tombol Checkout -->
          <div class="pt-3 border-t flex items-center justify-between">
            <div>
              <span class="text-xs text-gray-400 block">Total Estimasi</span>
              <span id="totalPrice" class="text-xl font-extrabold text-purple-800" aria-live="polite">Rp 10.000</span>
            </div>
            <button type="button" onclick="sendToWhatsApp()" class="bg-green-500 hover:bg-green-600 text-white font-bold px-5 py-2.5 rounded-xl text-sm shadow-lg hover:shadow-xl transition flex items-[...]
              <span>Pesan via WA</span>
            </button>
          </div>
        </form>
      </div>

    </div>

    <!-- Lokasi Toko & Jam Operasional -->
    <div class="bg-white rounded-3xl p-6 shadow-md border border-purple-100 flex flex-col md:flex-row gap-6 items-center">
      <div class="md:w-1/2 space-y-2">
        <h3 class="text-lg font-bold text-purple-900">📍 Lokasi Outlet Kami</h3>
        <p class="text-xs text-gray-600">
          Josroyo Indah, Jaten, Karanganyar 
        </p>
        <div class="text-xs text-purple-700 font-medium">
          ⏱️ Buka Setiap Hari: 10.00 - 20.00 WIB
        </div>
      </div>
      <div class="md:w-1/2 w-full h-40 bg-gray-200 rounded-2xl overflow-hidden shadow-inner">
        <!-- Embed Google Maps -->
        <iframe src="https://maps.app.goo.gl/8kNsVdEefH9Bhopy9?g_st=ac" class="w-full h-full border-0" allowfullscreen="" loading="lazy"></iframe>
      </div>
    </div>

  </main>

  <footer class="text-center py-6 text-xs text-gray-400">
    © 2026 Purple Taro Cheese. Freshly Made Everyday.
  </footer>

  <!-- Script Logika Form -->
  <script>
    let selectedSize = "Medium";
    let basePrice = 10000;
    let qty = 1;

    // Ganti dengan Nomor WhatsApp Toko Kamu (Format: 628xxx)
    const whatsappNumber = "6281319376420";

    function selectSize(size, price, btn) {
      selectedSize = size;
      basePrice = price;

      document.querySelectorAll('.size-btn').forEach(b => {
        b.classList.remove('border-purple-600', 'bg-purple-50', 'text-purple-900');
        b.classList.add('border-gray-200', 'text-gray-600');
        b.setAttribute('aria-pressed', 'false');
      });

      btn.classList.add('border-purple-600', 'bg-purple-50', 'text-purple-900');
      btn.classList.remove('border-gray-200', 'text-gray-600');
      btn.setAttribute('aria-pressed', 'true');

      calculateTotal();
    }

    function changeQty(delta) {
      qty = Math.max(1, qty + delta);
      document.getElementById('qtyText').innerText = qty;
      calculateTotal();
    }

    function calculateTotal() {
      let extra = 0;
      if(document.getElementById('topKeju').checked) extra += 3000;
      if(document.getElementById('topBoba').checked) extra += 3000;

      let total = (basePrice + extra) * qty;
      document.getElementById('totalPrice').innerText = "Rp " + total.toLocaleString('id-ID');
      return total;
    }

    function sendToWhatsApp() {
      const name = document.getElementById('buyerName').value.trim();
      if(!name) {
        alert("Silakan isi nama pemesan terlebih dahulu!");
        return;
      }

      let toppings = [];
      if(document.getElementById('topKeju').checked) toppings.push("Extra Keju");
      if(document.getElementById('topBoba').checked) toppings.push("Extra Boba");

      const toppingStr = toppings.length > 0 ? toppings.join(", ") : "Tanpa Topping Tambahan";
      const total = calculateTotal();

      // Build plain-text message, then encode once
      const message = 
        `Halo, saya mau pesan Minuman Ubi Ungu!\n\n` +
        ` Nama: ${name}\n` +
        ` Ukuran: ${selectedSize}\n` +
        ` Topping: ${toppingStr}\n` +
        ` Jumlah: ${qty} cup\n` +
        ` Total: Rp ${total.toLocaleString('id-ID')}\n\n` +
        `Mohon diproses ya, terima kasih!`;

      const encoded = encodeURIComponent(message);
      const url = `https://wa.me/${whatsappNumber}?text=${encoded}`;

      const win = window.open(url, '_blank');
      if (win) win.opener = null;
    }

    // Initialize UI
    document.addEventListener('DOMContentLoaded', () => {
      // Ensure initial button state matches initial variables
      const btn = document.getElementById('sizeMedium');
      if (btn) btn.setAttribute('aria-pressed', 'true');
      calculateTotal();
    });
  </script>

</body>
</html>
